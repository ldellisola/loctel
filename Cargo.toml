[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98.1"

# Every crate takes its dependencies from here with `dep.workspace = true`.
# Exact pins are added by the task that first needs each crate.
[workspace.dependencies]
loctel-model = { path = "crates/loctel-model" }
loctel-store = { path = "crates/loctel-store" }
loctel-ingest = { path = "crates/loctel-ingest" }
loctel-mcp = { path = "crates/loctel-mcp" }
loctel-engine = { path = "crates/loctel-engine" }
loctel-query = { path = "crates/loctel-query" }
loctel-rules = { path = "crates/loctel-rules" }
loctel-meshgen = { path = "crates/loctel-meshgen" }
loctel-ui = { path = "crates/loctel-ui" }
loctel-macos = { path = "crates/loctel-macos" }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

# OTLP ingest (loctel-ingest)
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics", "with-serde"] }
tonic = { version = "0.14.6", features = ["server", "gzip"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["decompression-gzip"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
prost = "0.14.4"
flate2 = "1.1.10"

# Engine and app (loctel-engine, loctel-app)
anyhow = "1.0.104"
toml = "1.1.8"
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tempfile = "3.27.0"

# Segment files (loctel-store, Milestone 5): `postcard` is the compact serde
# binary the blobs are written in (std only: no heapless buffers), `zstd` at
# level 1 compresses each record (defaults off: no legacy formats, no
# dictionary builder), `memmap2` reads sealed segments and `crc32fast` checks
# every record (decision 0044).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = { version = "0.14.3", default-features = false }
memmap2 = "0.9.12"
crc32fast = "1.5.3"
# `kill(pid, 0)`: is the process of a leftover run directory still alive
# (loctel-store `run_dir`). Already in the lockfile through tokio and others.
libc = "0.2.191"

# Fake mesh and its sender (loctel-meshgen). reqwest is built without default
# features on purpose: the default `system-proxy` would send requests for
# 127.0.0.1 through HTTP(S)_PROXY, and loctel's own endpoints are local.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
rand = { version = "0.10.3", default-features = false }
rand_chacha = "0.10.0"

# MCP server (loctel-mcp). rmcp is built without its defaults: the server
# half, the tool macros and the Streamable HTTP server transport are all the
# crate needs. The client half and its reqwest transport are dev-dependencies
# of the crates that test through a real MCP client.
rmcp = { version = "3.6.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tokio-util = "0.7.20"
jsonschema = { version = "0.59.0", default-features = false }

# Query languages (loctel-query). The `regex` crate is RE2-compatible, close to
# Go's `regexp` that Tempo and Loki use. Default features stay on: `\w` and
# `\d` are Unicode-aware here and ASCII-only in Go, which only matters for
# non-ASCII text (docs/areas/query.md).
regex = "1.13.1"

# UI (loctel-ui, loctel-app). GPUI comes as the weekly `gpui-pre` snapshot,
# pinned exactly: upgrades are deliberate, in their own PR (decision 0001).
# The platform crate gets both Linux windowing backends so the dev window
# works on X11 and Wayland; they compile only on Linux. `image` is the version
# GPUI's own `capture_screenshot` hands back, so the types match.
gpui-pre = "=0.3.9"
gpui-pre-platform = { version = "=0.3.9", features = ["x11", "wayland"] }
gpui-pre-wgpu = "=0.3.9"
image = { version = "0.25.1", default-features = false, features = ["png"] }
# GPUI Kit: the component library the main window is built from (table, input,
# toggles, buttons, split panels, scroll areas, tooltips) and the `Root` every
# window sits in. Its `gpui-pre =0.3.9` is the snapshot above, so the GPUI types
# are the same ones. Pinned exactly, like GPUI: upgrading is its own change
# (decision 0024, `.claude/skills/upgrade-gpui`).
gpui-kit = "=0.8.0"

# macOS shell (loctel-macos, loctel-app on macOS). `gpui-tray` is the status
# item. It is generic over which GPUI it is built for, and `gpui-kit` is the
# backend feature for `gpui-pre` (its docs call it "GPUI Kit's `gpui-pre`
# types"); `menu-state` (checkmarks and disabled items) is left on from when the
# status item had a menu: since Milestone 4 it has none and opens the popover
# (decision 0042). The objc2 crates are the ones the tray crate already uses, so
# there is one copy of each.
gpui-tray = { version = "0.2", default-features = false, features = ["gpui-kit", "menu-state"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSColor", "NSEvent", "NSGlassEffectView", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSScreen", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSValue"] }
objc2-service-management = "0.3.2"
# Liquid Glass (loctel-macos `glass.rs`): the window's AppKit view comes from
# GPUI's raw window handle (the same 0.6 GPUI uses), and the glass frames are
# applied from the main dispatch queue, never inside a GPUI frame. Both are
# already in the lockfile through GPUI and objc2.
raw-window-handle = "0.6"
dispatch2 = "0.3"

# Line tables only: full debug info made a clean test build about 12 GB of
# target/, too close to the free disk on CI runners and agent containers.
# Backtraces still show file and line.
[profile.dev]
debug = "line-tables-only"

# The store and the C library it compresses with are built with optimisations in
# the dev profile too: a test that fills a store with ten million logs (the Logs
# list's, `crates/loctel-ui/tests/logs_scale.rs`) ingested them at 4.7 us each
# unoptimised, 47 s of a 60 s budget, and at 1.1 us this way (decision 0051).
# Everything else, and debug assertions and overflow checks, stay as they were.
[profile.dev.package.loctel-store]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[workspace.lints.clippy]
all = "warn"
