[package]
name = "loctel-macos"
description = "The loctel macOS shell: menu bar status item, activation policy and start at login (empty on other operating systems)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Everything is macOS-only: on any other OS this crate is empty, so the Linux
# build never sees objc2 or the tray crate.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre.workspace = true
gpui-tray.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true
raw-window-handle.workspace = true
dispatch2.workspace = true
loctel-engine.workspace = true
loctel-ui.workspace = true
anyhow.workspace = true

# The parts that hold decisions (the menu's rows, the first-launch step, the
# icon files) are plain Rust, compiled for the tests on every OS, so the Linux
# gate runs them. The macOS-only code that draws them is only type-checked
# there (see `script/check-macos.sh`).
[dev-dependencies]
loctel-engine.workspace = true
anyhow.workspace = true
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
