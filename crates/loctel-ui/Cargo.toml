[package]
name = "loctel-ui"
description = "The loctel GPUI views (the status view and the main window shell), the pure view models, the menu text and the headless screenshot harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Headless rendering: GPUI's test support plus its software-capable wgpu
# renderer, which the screenshot tests and `loctel_ui::testing` need. Off in
# the shipped app. The dev-dependency on this crate below turns it on for
# every test, clippy and doc build in the workspace, so a plain
# `cargo test --workspace` runs the screenshot tests too.
screenshot = [
    "gpui-pre/test-support",
    "gpui-pre-platform/test-support",
    "dep:gpui-pre-wgpu",
    "gpui-pre-wgpu/test-support",
    "gpui-kit/test-support",
]

[dependencies]
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
# GPUI Kit: the components of the main window, and `Root` (src/app).
gpui-kit.workspace = true
loctel-engine.workspace = true
# The models (src/model) read the store's summaries and parse TraceQL; chrono's
# `clock` feature gives the system zone's offset for the clock times.
loctel-store.workspace = true
loctel-query.workspace = true
loctel-model.workspace = true
# The rules the backend passes around (`RuleSpec`, `RuleStatus`, `RuleId`,
# `Preview`) and the preview `FixedBackend` runs over its store.
loctel-rules.workspace = true
chrono = { workspace = true, features = ["clock"] }
# `Copy span as JSON` (the inspector) serialises the span the way MCP does.
serde_json.workspace = true
anyhow.workspace = true
image.workspace = true
# The software-capable text system the screenshot harness uses (Linux).
gpui-pre-wgpu = { workspace = true, optional = true }

[dev-dependencies]
loctel-ui = { path = ".", features = ["screenshot"] }
tempfile.workspace = true
# The model tests load the fake mesh into a store through the real converter.
loctel-meshgen.workspace = true
loctel-ingest.workspace = true

[lints]
workspace = true
