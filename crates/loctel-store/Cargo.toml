[package]
name = "loctel-store"
description = "Store for loctel (in memory, spilling to segment files): trace assembly, completeness, dedup, eviction, failure semantics, trace search (with TraceQL and LogQL filters), logs, removal and scans, service map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
loctel-model.workspace = true
loctel-query.workspace = true
parking_lot.workspace = true
serde.workspace = true
postcard.workspace = true
zstd.workspace = true
memmap2.workspace = true
crc32fast.workspace = true
libc.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# The query and removal tests load the fixed fake-mesh scenarios (CheckoutFailure,
# HugeTrace), converted by the real OTLP conversion code. meshgen itself has a
# dev-dependency on this crate, which Cargo allows: dev-dependencies of a
# dependency are never built.
loctel-meshgen.workspace = true
loctel-ingest.workspace = true

[lints]
workspace = true
